# Search
winning_tile=32
node_limit=0
progress_interval=100000

# Transposition table
use_transposition_table=true
use_tt_symmetry=true
load_tt=true
save_tt=true
tt_path=result/APTest/32_RZ_Pruning.tt

# Relevance-zone proof cache. lookup generates certificates and checks them
# before the exact TT; generate builds the same certificates without pruning.
rzone_mode=lookup
rzone_lookup_policy=smallest_first
use_rzone_symmetry=true
rzone_max_cells=16
rzone_shadow_exact_check=false
rzone_active_pruning=true
load_rz=true
save_rz=true
rz_path=result/APTest/32_RZ_Pruning.rz

# Fixed opening: tile@row-major-position, exactly two tiles
opening=2@0,2@1

# N-tuple evaluator
network=4x6patt
model_path=models/4x6patt.w

# Search tree output
sgf_path=result/APTest/32_RZ_Pruning.sgf
